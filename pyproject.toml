[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "edi-schema"
# Aligned with the release tag (v0.5.0: schema $id values moved to the
# engineering-decision-schema address). Kept in lockstep with
# src/edi_schema/__init__.py __version__ by tests/test_version_sync.py — bump both together.
version = "0.5.0"
description = "Shared episode schema: JSON Schemas and validation for engineering-decision episodes, run manifests, and ZK profile reports"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "PostOakLabs" }]
keywords = ["schema", "json-schema", "eda", "zero-knowledge", "provenance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
# ruff is pinned exactly, not floated: isort's import-block behaviour changes
# between minor releases (0.15 vs 0.16 disagree on third-party/first-party
# separation), and CI floated itself past local dev, turning `ruff check` into a
# gate that passes locally and fails on the runner. Keep this in lockstep with
# RUFF_VERSION in .github/workflows/ci.yml — both must be bumped together.
dev = ["pytest>=8.3", "ruff==0.16.5"]

[project.urls]
Repository = "https://github.com/PostOakLabs/engineering-decision-schema"

[project.scripts]
edi-validate = "edi_schema.cli:main"
edi-croissant = "edi_schema.croissant_cli:main"

# Canonical layout: schemas live at the repo root (see README). The wheel maps
# that directory into the installed package so `pip install git+https://...`
# consumers get the schemata at edi_schema/schemas/ without duplicating files.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "edi_schema/schemas"

[tool.hatch.build.targets.wheel]
packages = ["src/edi_schema"]

[tool.hatch.build.targets.sdist]
include = ["schemas", "src", "tests", "examples", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
